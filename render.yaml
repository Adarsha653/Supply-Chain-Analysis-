services:
  - type: web
    name: supply-chain-catalog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt -r requirements-web.txt
    startCommand: gunicorn step1.flask_app.app:app --bind 0.0.0.0:$PORT --timeout 120 --workers 1
    envVars:
      - key: SAMPLE_FRAC
        value: "0.01"
      - key: PYTHON_VERSION
        value: "3.11.9"
